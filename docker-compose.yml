version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3001:3001"
    environment:
      - TRADING_MODE=${TRADING_MODE:-paper}
      - KITE_API_KEY=${KITE_API_KEY:-}
      - KITE_API_SECRET=${KITE_API_SECRET:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_PRIMARY=${LLM_PRIMARY:-claude}
      - DATABASE_PATH=/app/data/db/trading.db
      - API_PORT=3001
      - API_HOST=0.0.0.0
      - NODE_ENV=production
      - TZ=Asia/Kolkata
      - MAX_PORTFOLIO_DRAWDOWN=${MAX_PORTFOLIO_DRAWDOWN:-0.15}
      - DAILY_LOSS_LIMIT=${DAILY_LOSS_LIMIT:-0.03}
      - MAX_PER_TRADE_RISK=${MAX_PER_TRADE_RISK:-0.08}
      - RISK_PER_TRADE=${RISK_PER_TRADE:-0.015}
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
